# Xcode-Projekt für Panora (XcodeGen). Erzeugen: scripts/build_app.sh (oder xcodegen generate)
# MLX übersetzt seine Metal-Shader nur mit xcodebuild – deshalb ein Xcode-Projekt statt `swift build`.
# Ergebnis: Panora.app (Apple Silicon, arm64).
name: Panora
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: arm64
      SWIFT_OPTIMIZATION_LEVEL: "-O"
packages:
  PanoraPackage:
    path: .
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Panora:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Panora
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/PanoraIcon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Panora
        PRODUCT_BUNDLE_IDENTIFIER: de.panora.app
        INFOPLIST_FILE: Xcode/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: PanoraPackage
        product: PanoraCore
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    scheme: {}
  # Vorschau ohne MLX (z. B. auf Intel-Runnern der CI): gleiche Oberfläche, keine Modelle – nur für Tests und Bilder.
  PanoraPreview:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Panora
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/PanoraIcon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Panora
        PRODUCT_BUNDLE_IDENTIFIER: de.panora.app
        INFOPLIST_FILE: Xcode/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PANORA_NO_MLX"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: PanoraPackage
        product: PanoraCore
    scheme: {}
