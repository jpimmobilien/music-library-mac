# Speicher für den Gradle-Prozess. 4 GB reichen für dieses Projekt bequem aus.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Module parallel bauen (das Projekt besteht aus mehreren unabhängigen Modulen).
org.gradle.parallel=true

# Offizieller Kotlin-Codestil.
kotlin.code.style=official

# ---------------------------------------------------------------------------------------------
# Name der App – an GENAU dieser Stelle änderbar (früher „Aether“; Paket- und Modulnamen bleiben unverändert, damit Einstellungen und Daten erhalten bleiben).
# Wird beim Bauen als Anzeigename (Startbildschirm) und als BuildConfig.APP_NAME (Texte in der App)
# übernommen. Nach einer Änderung: File > Sync Project with Gradle Files.
# ---------------------------------------------------------------------------------------------
aether.appName=ORBIT
