# Leerlauf-Profil zweier DMGs auf demselben Rechner (nur von Hand): je zwei Messläufe mit Stichproben
# (/usr/bin/sample) während „Leerlauf mit Wiedergabe“. Ergebnisse im Zweig „ci-profil-<runner>“.
name: Profil

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Lauf-Nummer mit der neuen DMG
        required: true
      old_run_id:
        description: Lauf-Nummer mit der alten DMG
        default: "42223937971"
      runner:
        default: "macos-26-intel"

permissions:
  contents: write
  actions: read

jobs:
  profil:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Music-Library-dmg, path: dist-neu, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { name: Music-Library-dmg, path: dist-alt, run-id: "${{ inputs.old_run_id }}", github-token: "${{ github.token }}" }
      - name: Apps auspacken
        run: |
          for v in alt neu; do
            MNT="$(mktemp -d)"
            hdiutil attach "dist-$v/Music Library.dmg" -nobrowse -readonly -mountpoint "$MNT" | tail -1
            ditto "$MNT/Music Library.app" "v-$v.app"
            hdiutil detach "$MNT" | tail -1
          done
      - name: Profile (abwechselnd)
        continue-on-error: true
        run: |
          mkdir -p out
          for round in 1 2; do
            for v in alt neu; do
              echo "== $v Runde $round" | tee -a out/zusammenfassung.txt
              scripts/profile_idle.sh "v-$v.app" "out/$v-$round" 2>&1 | tee -a out/zusammenfassung.txt
            done
          done
      - name: Ergebnisse sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b "ci-profil-${{ inputs.runner }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Profil" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-profil-${{ inputs.runner }}"
