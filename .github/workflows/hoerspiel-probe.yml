# Machbarkeitsprobe „KI-Hörspiel“ (Phase 1). Nur von Hand.
#   catalog  Linux: Modellkatalog gegen Hugging Face prüfen (gibt es das Repo, frei zugänglich, Größe, Lizenz)
#   story    Linux: Geschichte mit Gemma 4 26B-A4B (llama.cpp, Q3_K_M) – Stellvertreter für das große Modell auf dem Mac
#   tts      Mac: deutsche Sprachausgabe im Vergleich (Qwen3-TTS, VoxCPM2, Chatterbox, Piper) + kleines MLX-Sprachmodell
#   produce  Mac: 10-Minuten-Hörspiel aus der Geschichte (Stimmen, Geräusche, Musik über die KI-Musik, Mischung)
#   app      Mac: Abnahme mit der gebauten App (--hoerspiel-e2e): Einrichtung, Hörspiel, Editor, Mehrspur, Export,
#            Hörbuch, Stimmenstudio, Referenzanalyse – derselbe Code wie beim Klicken
#   samples  Linux: Hörproben mit dem PyTorch-Original von Qwen3-TTS (dieselben Gewichte, nicht der App-Code) – solange
#            keine Apple-Silicon-Rechner zugeteilt werden
#   analyze  Mac: Referenzanalyse (MLS-Testaufnahme mit Wahrheit, eigene Produktion, LibriVox), Stimmprofile
# Ergebnisse je Teil im Zweig „ci-hoerspiel-<teil>-<rechner>“ (Geschichte: „ci-hoerspiel-story“).
name: Hoerspiel-Probe

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Teile (catalog,story,tts,produce,analyze,app,samples)"
        default: "story,tts,produce,analyze"
      runner:
        description: "Apple-Silicon-Rechner"
        default: "macos-15"
      minutes:
        description: "Länge des Hörspiels in Minuten"
        default: "10"
      llm_repo:
        description: "GGUF-Modell für die Geschichte (Hugging Face)"
        default: "bartowski/google_gemma-4-26B-A4B-it-GGUF"
      llm_quant:
        description: "Quantisierung (Teil des Dateinamens)"
        default: "Q3_K_M"
      tag:
        description: "Kennung für den Ergebnis-Zweig der Geschichte (leer = ci-hoerspiel-story)"
        default: ""
      tts_only:
        description: "Nur diese Sprachausgaben (leer = alle; z. B. qwen_design,qwen_clone,chatterbox)"
        default: ""
      mlx_llm:
        description: "Kleines MLX-Sprachmodell für den Mac-Test"
        default: "mlx-community/Qwen3.5-4B-MLX-4bit"

concurrency:
  group: hoerspiel-probe-${{ inputs.jobs }}-${{ inputs.runner }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ACE_COMMIT: ca1e85fe9430179831e6bc6be790c332190a3866
  MLX_AUDIO: "mlx-audio==0.6.5"

jobs:
  catalog:
    if: contains(inputs.jobs, 'catalog')
    name: Modellkatalog (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen
        run: python3 scripts/hoerspiel/catalog_check.py out
      - name: Ladeweg der App (download.py, danach ohne Netz)
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/hub" && "$RUNNER_TEMP/hub/bin/pip" install -q huggingface_hub
          "$RUNNER_TEMP/hub/bin/python" scripts/hoerspiel/offline_check.py out mlx-community/silero-vad 7bc17f22d3c0451bd3a6cd71e759b009271ff49a
          "$RUNNER_TEMP/hub/bin/pip" show huggingface_hub | head -2 | tee -a out/offline-version.txt
      - name: Ergebnisse in Zweig sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="ci-hoerspiel-catalog"
          cd out
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Hörspiel-Probe catalog $GITHUB_SHA" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"

  story:
    if: contains(inputs.jobs, 'story')
    name: Geschichte (Linux, llama.cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Rechner
        run: |
          mkdir -p out
          { uname -a; nproc; free -g; df -h . | tail -1; } | tee out/rechner.txt
      - name: llama.cpp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/llama" && cd "$RUNNER_TEMP/llama"
          if gh release download -R ggml-org/llama.cpp -p "llama-*-bin-ubuntu-x64.zip" > /dev/null 2>&1; then
            unzip -q llama-*-bin-ubuntu-x64.zip
          else
            git clone -q --depth 1 https://github.com/ggml-org/llama.cpp src
            cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF > /dev/null
            cmake --build build -j "$(nproc)" --target llama-server > /dev/null
          fi
          SERVER=$(find "$RUNNER_TEMP/llama" -name llama-server -type f | head -1)
          chmod +x "$SERVER"
          echo "SERVER=$SERVER" >> "$GITHUB_ENV"
          "$SERVER" --version 2>&1 | tail -2 | tee -a "$GITHUB_WORKSPACE/out/rechner.txt"
      - name: Modell laden
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q huggingface_hub numpy scipy
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import os, sys
          from huggingface_hub import HfApi, hf_hub_download
          repo, quant = "${{ inputs.llm_repo }}", "${{ inputs.llm_quant }}"
          files = [f for f in HfApi().list_repo_files(repo) if f.endswith(".gguf") and quant.lower() in f.lower()]
          files = [f for f in files if "mmproj" not in f.lower()]
          print("Kandidaten:", files)
          if not files: sys.exit("kein passendes GGUF")
          p = hf_hub_download(repo, sorted(files, key=len)[0], local_dir=os.environ["RUNNER_TEMP"] + "/gguf")
          print("Modell:", p, os.path.getsize(p) // 2**20, "MB")
          open(os.environ["GITHUB_ENV"], "a").write(f"GGUF={p}\nGGUF_NAME={os.path.basename(p)}\n")
          EOF
          echo "Modell: $GGUF_NAME" | tee -a out/rechner.txt
      - name: Geschichte schreiben
        run: |
          "$SERVER" -m "$GGUF" -c 16384 -t "$(nproc)" --port 8080 --jinja -ngl 0 > out/llama-server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health > /dev/null && break; sleep 5; done
          curl -s http://127.0.0.1:8080/health; echo
          export HS_LLM_URL=http://127.0.0.1:8080 HS_LLM_NAME="$GGUF_NAME" HS_LLM_LABEL=story
          python scripts/hoerspiel/probe_story.py out "${{ inputs.minutes }}" 2>&1 | tee out/story.log | grep -E "\[Geschichte\]|\[Probe\]|Error|Traceback"
          test -f out/story.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story
          path: out/story.json
          if-no-files-found: ignore
      - name: Ergebnisse in Zweig sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          BR="ci-hoerspiel-story${TAG:+-$TAG}"
          cd out
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Hörspiel-Probe story $GITHUB_SHA" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"

  tts:
    if: contains(inputs.jobs, 'tts')
    name: Sprachausgabe (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Rechner und Umgebung
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; echo "RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"; df -h "$HOME" | tail -1; } | tee out/rechner.txt
            command -v ffmpeg >/dev/null || brew install --quiet ffmpeg > out/brew.log 2>&1 || true
            EXTRA=""
          else
            # Linux: MLX nur auf dem Prozessor – für Qualitätsmessungen, Geschwindigkeit ist nicht mit dem Mac vergleichbar
            { uname -a; nproc; free -g; lscpu | grep "Model name"; } | tee out/rechner.txt
            command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; } > out/apt.log 2>&1 || true
            EXTRA="mlx[cpu]"
          fi
          curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          uv venv -q --python 3.12 "$RUNNER_TEMP/hs"
          uv pip install -q --python "$RUNNER_TEMP/hs/bin/python" "$MLX_AUDIO" $EXTRA mlx-whisper mlx-lm soundfile scipy piper-tts > out/install.log 2>&1 || tail -30 out/install.log
          uv pip list --python "$RUNNER_TEMP/hs/bin/python" > out/pakete.txt
          uv pip install -q --python "$RUNNER_TEMP/hs/bin/python" pip-licenses > /dev/null 2>&1 && "$RUNNER_TEMP/hs/bin/pip-licenses" --format=markdown --with-urls > out/lizenzen-pakete.md 2>/dev/null || true
      - name: Sprachausgabe vergleichen
        continue-on-error: true
        run: |
          export HS_TTS_ONLY="${{ inputs.tts_only }}"
          if [ "$RUNNER_OS" = macOS ]; then TF="-l"; else TF="-v"; fi
          /usr/bin/time $TF "$RUNNER_TEMP/hs/bin/python" scripts/hoerspiel/probe_tts.py out > out/tts.log 2>&1
          STATUS=$?
          grep -E "\[Probe\]|maximum resident|Maximum resident" out/tts.log | cut -c1-400 | head -60
          exit $STATUS
      - name: Kleines Sprachmodell (MLX) schreibt eine Kurzgeschichte
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          export HS_LLM_MLX="${{ inputs.mlx_llm }}" HS_LLM_LABEL=mlx-story
          "$RUNNER_TEMP/hs/bin/python" scripts/hoerspiel/probe_story.py out 3 > out/mlx-story.log 2>&1 || \
            { export HS_LLM_MLX="mlx-community/Qwen3-4B-Instruct-2507-4bit"; "$RUNNER_TEMP/hs/bin/python" scripts/hoerspiel/probe_story.py out 3 >> out/mlx-story.log 2>&1; }
          grep -E "\[Geschichte\]|\[Probe\]" out/mlx-story.log | cut -c1-300
      - name: Ergebnisse in Zweig sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="ci-hoerspiel-tts-${{ inputs.runner }}"
          cd out
          rm -rf piper-voices
          find . -name "*.wav" -delete || true
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Hörspiel-Probe tts $GITHUB_SHA" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"

  produce:
    needs: [story]
    if: always() && contains(inputs.jobs, 'produce')
    name: Produktion (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: story
          path: story-in
      - name: Geschichte bereitstellen
        run: |
          mkdir -p out
          if [ ! -f story-in/story.json ]; then
            git clone -q --depth 1 -b ci-hoerspiel-story "https://github.com/${GITHUB_REPOSITORY}.git" story-branch
            mkdir -p story-in && cp story-branch/story.json story-in/
          fi
          python3 -c "import json;s=json.load(open('story-in/story.json'));print(s['concept'].get('titel'), len(s['scenes']), 'Szenen', s['words'], 'Wörter')"
          if [ "$RUNNER_OS" = macOS ]; then
            { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; echo "RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"; df -h "$HOME" | tail -1; } | tee out/rechner.txt
          else
            # Linux: Platz schaffen (vorinstallierte SDKs), MLX/ACE-Step nur auf dem Prozessor
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
            { uname -a; nproc; free -g; lscpu | grep "Model name"; df -h / | tail -1; } | tee out/rechner.txt
          fi
      - name: Umgebungen (Hörspiel und KI-Musik)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            command -v ffmpeg >/dev/null || brew install --quiet ffmpeg > out/brew.log 2>&1 || true
            EXTRA=""
          else
            command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; } > out/apt.log 2>&1 || true
            EXTRA="mlx[cpu]"
          fi
          curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          uv venv -q --python 3.12 "$RUNNER_TEMP/hs"
          uv pip install -q --python "$RUNNER_TEMP/hs/bin/python" "$MLX_AUDIO" $EXTRA mlx-whisper soundfile scipy > out/install.log 2>&1 || tail -30 out/install.log
          git clone -q https://github.com/ace-step/ACE-Step-1.5.git "$RUNNER_TEMP/ace"
          git -C "$RUNNER_TEMP/ace" checkout -q "$ACE_COMMIT"
          cd "$RUNNER_TEMP/ace" && uv sync > "$GITHUB_WORKSPACE/out/uv-sync.log" 2>&1 || tail -40 "$GITHUB_WORKSPACE/out/uv-sync.log"
          uv run acestep-download --dir "$RUNNER_TEMP/checkpoints" > "$GITHUB_WORKSPACE/out/ace-download.log" 2>&1 || tail -20 "$GITHUB_WORKSPACE/out/ace-download.log"
      - name: Hörspiel produzieren
        env:
          KI_PYTHON: ${{ runner.temp }}/ace/.venv/bin/python
          KI_ACE_ROOT: ${{ runner.temp }}/ace
          KI_CHECKPOINTS: ${{ runner.temp }}/checkpoints
        run: |
          if [ "$RUNNER_OS" = macOS ]; then TF="-l"; else TF="-v"; export KI_MLX_DIT=0 KI_LM_BACKEND=pt; df -h / | tail -1; fi
          /usr/bin/time $TF "$RUNNER_TEMP/hs/bin/python" scripts/hoerspiel/probe_produce.py story-in/story.json out > out/produce.log 2>&1
          STATUS=$?
          grep -E "\[Probe\]|maximum resident|Maximum resident" out/produce.log | cut -c1-500 | head -80
          cp "$RUNNER_TEMP/ki-musik-hoerspiel.log" out/ 2>/dev/null || true
          exit $STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: produktion
          path: |
            out/hoerspiel.mp3
            out/sprecher-wahrheit.json
          if-no-files-found: ignore
      - name: Ergebnisse in Zweig sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="ci-hoerspiel-produce-${{ inputs.runner }}"
          cd out
          find . -name "*.wav" -size +1M -delete || true
          find . -name "*.flac" | while read -r f; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.*}.mp3" && rm "$f"; done || true
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Hörspiel-Probe produce $GITHUB_SHA" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"

  analyze:
    needs: [produce]
    if: always() && contains(inputs.jobs, 'analyze')
    name: Referenzanalyse (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: produktion
          path: prod-in
      - name: Umgebung
        run: |
          mkdir -p out prod-in
          if [ ! -f prod-in/hoerspiel.mp3 ]; then
            for b in "ci-hoerspiel-produce-${{ inputs.runner }}" ci-hoerspiel-produce-macos-15 ci-hoerspiel-produce-macos-14 ci-hoerspiel-produce-macos-26 ci-hoerspiel-produce-ubuntu-latest ci-hoerspiel-produce; do
              rm -rf prod-branch
              git clone -q --depth 1 -b "$b" "https://github.com/${GITHUB_REPOSITORY}.git" prod-branch 2>/dev/null && \
                cp prod-branch/hoerspiel.mp3 prod-branch/sprecher-wahrheit.json prod-in/ 2>/dev/null && { echo "Produktion aus $b"; break; }
            done || true
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; echo "RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"; } | tee out/rechner.txt
            command -v ffmpeg >/dev/null || brew install --quiet ffmpeg > out/brew.log 2>&1 || true
            EXTRA=""
          else
            { uname -a; nproc; free -g; lscpu | grep "Model name"; } | tee out/rechner.txt
            command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; } > out/apt.log 2>&1 || true
            EXTRA="mlx[cpu]"
          fi
          curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          uv venv -q --python 3.12 "$RUNNER_TEMP/hs"
          uv pip install -q --python "$RUNNER_TEMP/hs/bin/python" "$MLX_AUDIO" $EXTRA mlx-whisper soundfile scipy pyarrow huggingface_hub > out/install.log 2>&1 || tail -30 out/install.log
      - name: Analysieren
        run: |
          if [ "$RUNNER_OS" = macOS ]; then TF="-l"; else TF="-v"; fi
          /usr/bin/time $TF "$RUNNER_TEMP/hs/bin/python" scripts/hoerspiel/probe_analyze.py out prod-in > out/analyze.log 2>&1
          STATUS=$?
          grep -E "\[Probe\]|maximum resident|Maximum resident" out/analyze.log | cut -c1-600 | head -60
          exit $STATUS
      - name: Ergebnisse in Zweig sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="ci-hoerspiel-analyze-${{ inputs.runner }}"
          cd out
          find . -name "*.wav" -size +1M -delete || true
          rm -f analyse/librivox.mp3
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Hörspiel-Probe analyze $GITHUB_SHA" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"

  app:
    if: contains(inputs.jobs, 'app')
    name: App-Abnahme (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          mkdir -p out
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; echo "RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"; df -h "$HOME" | tail -1; xcodebuild -version | head -1; } | tee out/rechner.txt
          command -v ffmpeg >/dev/null || brew install --quiet ffmpeg > out/brew.log 2>&1 || true
      - name: App bauen
        run: |
          ARCHS="$(uname -m)" scripts/build_app.sh > out/build-app.log 2>&1 || { grep -n "error:" out/build-app.log | head -50; tail -40 out/build-app.log; exit 1; }
          ls -la "build/Music Library.app/Contents/Resources/HoerspielEngine"
      - name: Abnahme
        env:
          HS_E2E_STORY: ${{ inputs.mlx_llm }}
          HS_E2E_MINUTES: "3"
        run: |
          "build/Music Library.app/Contents/MacOS/Music Library" --hoerspiel-e2e "$PWD/out/e2e" > out/app.log 2>&1
          STATUS=$?
          cat out/e2e/e2e.log 2>/dev/null | cut -c1-400
          exit $STATUS
      - name: Ergebnisse in Zweig sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="ci-hoerspiel-app-${{ inputs.runner }}"
          cd out
          rm -rf e2e/Umgebung
          find . -name "*.wav" -size +1M -delete || true
          find . -name "*.m4a" -size +20M -delete || true
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Hörspiel-Probe app $GITHUB_SHA" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"

  samples:
    if: contains(inputs.jobs, 'samples')
    name: Hörproben (Linux, PyTorch)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Umgebung
        run: |
          mkdir -p out
          { uname -a; nproc; free -g; lscpu | grep "Model name"; } | tee out/rechner.txt
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q ffmpeg sox > out/apt.log 2>&1
          python3 -m venv "$RUNNER_TEMP/pt"
          P="$RUNNER_TEMP/pt/bin/pip"
          $P install -q --upgrade pip
          $P install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu > out/install.log 2>&1
          $P install -q "git+https://github.com/QwenLM/Qwen3-TTS@022e286b98fbec7e1e916cb940cdf532cd9f488e" faster-whisper soundfile scipy >> out/install.log 2>&1 || tail -30 out/install.log
          $P list > out/pakete.txt
          git clone -q --depth 1 -b "ci-hoerspiel-story${{ inputs.tag && format('-{0}', inputs.tag) || '' }}" "https://github.com/${GITHUB_REPOSITORY}.git" story-in
          ls story-in
      - name: Hörproben erzeugen
        run: |
          "$RUNNER_TEMP/pt/bin/python" scripts/hoerspiel/probe_torch_samples.py story-in/story.json out 200 > out/proben.log 2>&1
          STATUS=$?
          grep "\[Probe\]" out/proben.log | cut -c1-500
          exit $STATUS
      - name: Ergebnisse in Zweig sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="ci-hoerspiel-samples"
          cd out
          find . -name "*.wav" -delete || true
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
