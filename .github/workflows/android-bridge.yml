# Android Bridge – Tests, Universal-Build, DMG, Installations- und Starttests auf echten macOS-Rechnern
#
#   1. build   macOS 26 (Apple Silicon, Xcode 26): Unit-Tests → arm64 + x86_64 → lipo → App-Bundle
#              (ad-hoc signiert) → Bildschirmfotos → AndroidBridge.dmg (eingehängt und geprüft)
#              Danach auf demselben Rechner: DMG installieren und starten – nativ (arm64) und über Rosetta (x86_64)
#   2. smoke   Fertige DMG auf einem echten Intel-Mac (macOS 15) installieren und starten
#              (GitHub bietet keine macOS-13/14-Rechner mehr; Apple-Silicon-Rechner sind oft ausgelastet)
#      intel   Intel-Mac: alle Unit-Tests in x86_64
#   3. results DMG, Protokolle, Bildschirmfotos in den Zweig „ci-ergebnisse-android-bridge“
name: Android Bridge

on:
  push:
    branches: [android-bridge]
  workflow_dispatch:

concurrency:
  group: android-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, Universal-Build, DMG (${{ matrix.os }})
    # Vier Build-Rechner parallel: macOS 26 (Apple Silicon, Liquid Glass), macOS 26 Intel (Xcode 26), macOS 15 Apple Silicon
    # (zuverlässige Grafik für Bildschirmfotos aller Seiten) und Intel (macOS 15). Geliefert wird bevorzugt eine Xcode-26-DMG.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ "${MAJOR:-0}" -lt 26 ] && [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          sw_vers; uname -m; xcodebuild -version; swift --version
      - name: Kompilieren (Fehlerübersicht)
        run: |
          set +e
          mkdir -p logs
          swift build -c release --product AndroidBridge > logs/compile.txt 2>&1
          STATUS=$?
          echo "::group::Fehler"
          grep -n "error:" logs/compile.txt | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -300
          echo "::endgroup::"
          grep -n "warning:" logs/compile.txt | grep "Sources/" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -200 > logs/warnings.txt
          tail -5 logs/compile.txt
          exit $STATUS
      - name: Unit-Tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee logs/test-output.txt
      - name: App bauen (arm64 + x86_64)
        env:
          VERSION: "5.4.0"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          scripts/build_app.sh 2>&1 | tee logs/build-output.txt
      - name: Selbsttest (macOS 26, nativ)
        run: scripts/run_selftest.sh "build/Android Bridge.app" logs/selftest-macos26.json
      - name: DMG erstellen und prüfen
        run: |
          set -o pipefail
          scripts/make_dmg.sh 2>&1 | tee logs/dmg-output.txt
      - name: Aus der DMG installieren und starten (nativ; auf Apple Silicon zusätzlich Intel-Teil über Rosetta)
        run: |
          set -e
          MNT="$(mktemp -d)"
          hdiutil attach dist/AndroidBridge.dmg -nobrowse -readonly -mountpoint "$MNT"
          mkdir -p "$HOME/Applications"
          rm -rf "$HOME/Applications/Android Bridge.app"
          ditto "$MNT/Android Bridge.app" "$HOME/Applications/Android Bridge.app"
          hdiutil detach "$MNT"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Android Bridge.app"
          scripts/run_selftest.sh "$HOME/Applications/Android Bridge.app" logs/selftest-installiert-${{ matrix.os }}.json
          if [ "$(uname -m)" = "arm64" ]; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
            SNAPSHOT_ARCH=x86_64 scripts/run_selftest.sh "$HOME/Applications/Android Bridge.app" logs/selftest-installiert-${{ matrix.os }}-rosetta.json
          fi
      # Bildschirmfotos zuletzt: stürzt die virtuelle GPU der Build-Maschine ab, bleiben Installationstest und DMG unberührt.
      - name: Bildschirmfotos (Liquid Glass)
        continue-on-error: true
        env:
          # Intel-VMs: deren virtuelle Grafik stürzt bei Seiten mit Fotos ab – dort nur die übrigen Seiten (alle Seiten: Apple Silicon)
          SNAPSHOT_GROUPS: ${{ contains(matrix.os, 'intel') && '01 02 06 08 10 11 13 15 16 17 18 19' || '' }}
        run: scripts/run_snapshots.sh "build/Android Bridge.app" snapshots/${{ matrix.os }}-glass
      - name: Bildschirmfotos (Rückfall ohne Liquid Glass)
        continue-on-error: true
        env:
          AB_FORCE_GLASS_FALLBACK: "1"
          # Intel-VMs: deren virtuelle Grafik stürzt bei Seiten mit Fotos ab – dort nur die übrigen Seiten (alle Seiten: Apple Silicon)
          SNAPSHOT_GROUPS: ${{ contains(matrix.os, 'intel') && '01 02 06 08 10 11 13 15 16 17 18 19' || '' }}
        run: scripts/run_snapshots.sh "build/Android Bridge.app" snapshots/${{ matrix.os }}-fallback
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidBridge-dmg-${{ matrix.os }}
          path: |
            dist/AndroidBridge.dmg
            dist/AndroidBridge.dmg.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-build-${{ matrix.os }}
          path: |
            logs/
            snapshots/
          if-no-files-found: ignore

  smoke:
    name: Installation + Start (${{ matrix.label }})
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: Intel-Mac · macOS 15
            arch: ""
            name: macos15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AndroidBridge-dmg-*
          path: dmgs
      - name: DMG wählen (bevorzugt macOS-26-Build)
        run: |
          mkdir -p dist
          SRC=dmgs/AndroidBridge-dmg-macos-26
          [ -f "$SRC/AndroidBridge.dmg" ] || SRC=dmgs/AndroidBridge-dmg-macos-15-intel
          cp "$SRC"/AndroidBridge.dmg* dist/
          echo "Verwendet: $SRC"
      - name: Rosetta bereitstellen
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: DMG einhängen und wie ein Benutzer installieren
        run: |
          set -e
          mkdir -p "logs/${{ matrix.name }}"
          { sw_vers; uname -m; } | tee "logs/${{ matrix.name }}/system.txt"
          (cd dist && shasum -a 256 -c AndroidBridge.dmg.sha256)
          MNT="$(mktemp -d)"
          hdiutil attach dist/AndroidBridge.dmg -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT" | tee "logs/${{ matrix.name }}/dmg-inhalt.txt"
          test -L "$MNT/Programme"
          mkdir -p "$HOME/Applications"
          ditto "$MNT/Android Bridge.app" "$HOME/Applications/Android Bridge.app"
          hdiutil detach "$MNT"
          lipo -archs "$HOME/Applications/Android Bridge.app/Contents/MacOS/AndroidBridge" | tee -a "logs/${{ matrix.name }}/system.txt"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Android Bridge.app"
      - name: App starten (Selbsttest)
        env:
          SNAPSHOT_ARCH: ${{ matrix.arch }}
        run: scripts/run_selftest.sh "$HOME/Applications/Android Bridge.app" "logs/${{ matrix.name }}/selftest.json"
      - name: Bildschirmfotos
        if: always()
        continue-on-error: true
        env:
          SNAPSHOT_ARCH: ${{ matrix.arch }}
          # Intel-VMs: deren virtuelle Grafik stürzt bei Seiten mit Fotos ab – dort nur die übrigen Seiten (alle Seiten: Apple Silicon)
          SNAPSHOT_GROUPS: ${{ contains(matrix.os, 'intel') && '01 02 06 08 10 11 13 15 16 17 18 19' || '' }}
        run: scripts/run_snapshots.sh "$HOME/Applications/Android Bridge.app" "snapshots/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: |
            logs/
            snapshots/
          if-no-files-found: ignore

  intel:
    name: Unit-Tests · Intel (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          set -o pipefail
          mkdir -p logs
          { sw_vers; uname -m; swift --version; } | tee logs/system-intel.txt
          swift test 2>&1 | tee logs/test-output-intel.txt
          swift build -c release --product AndroidBridge 2>&1 | tail -3 | tee logs/build-intel-xcode16.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-tests
          path: logs/
          if-no-files-found: ignore

  results:
    name: Ergebnisse sichern
    if: always()
    needs: [build, smoke, intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ergebnisse
      - name: Bilder verkleinern (PNG → JPEG)
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow
          python3 - <<'PY'
          import pathlib
          from PIL import Image
          for p in pathlib.Path("ergebnisse").rglob("*.png"):
              Image.open(p).convert("RGB").save(p.with_suffix(".jpg"), quality=86, optimize=True)
              p.unlink()
          PY
      - name: In Zweig „ci-ergebnisse-android-bridge“ schreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ergebnisse
          {
            echo "Lauf: ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
            echo "build: ${{ needs.build.result }}"
          ls -d AndroidBridge-dmg-* 2>/dev/null | sed 's/^/dmg: /' 
            echo "smoke: ${{ needs.smoke.result }}"
            echo "intel: ${{ needs.intel.result }}"
            date -u
          } > ERGEBNIS.txt
          git init -q -b ci-ergebnisse-android-bridge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI-Ergebnisse Android Bridge Lauf ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-ergebnisse-android-bridge
