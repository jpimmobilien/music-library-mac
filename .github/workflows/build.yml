# Music Library für macOS – Tests, Universal-Build, Vorschaubilder, DMG
#
# Ablauf:
#   1. tests      Swift-Tests (Logik, Datenbank, Tags, Renderer, App) auf Apple Silicon (macOS 26) und Intel (macOS 15)
#   2. build      Universal Binary (arm64 + x86_64) mit Xcode 26 → App-Bundle → ad-hoc signiert → Vorschaubilder → DMG
#   3. smoke      Die fertige DMG wird auf weiteren Rechnern eingehängt, die App installiert und im
#                 Vorschaumodus gestartet (Intel/macOS 15, Apple Silicon/macOS 14)
#   4. release    Nur bei Tags „v*“: GitHub-Release mit DMG und Prüfsumme
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            label: Apple Silicon · macOS 26
          - os: macos-15-intel
            label: Intel · macOS 15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Swift-Tests
        run: swift test 2>&1 | tee test-output.txt
      - name: Testprotokoll sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt

  build:
    name: Universal-Build + DMG
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: App bauen (arm64 + x86_64, ad-hoc signiert)
        env:
          VERSION: "1.0.0"
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build_app.sh
      - name: Vorschaubilder (Liquid Glass)
        run: scripts/run_snapshots.sh "build/Music Library.app" snapshots/macos26-liquid-glass
      - name: Vorschaubilder (Rückfall ohne Liquid Glass)
        env:
          ML_FORCE_GLASS_FALLBACK: "1"
        run: scripts/run_snapshots.sh "build/Music Library.app" snapshots/macos26-fallback
      - name: DMG erstellen
        run: scripts/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Library-dmg
          path: |
            dist/Music Library.dmg
            dist/Music Library.dmg.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-macos26
          path: snapshots/
          if-no-files-found: warn

  smoke:
    name: Starttest (${{ matrix.label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: Intel · macOS 15
          - os: macos-14
            label: Apple Silicon · macOS 14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Music-Library-dmg
          path: dist
      - name: DMG einhängen und App installieren
        run: |
          sw_vers
          uname -m
          cd dist && shasum -a 256 -c "Music Library.dmg.sha256" && cd ..
          MNT="$(mktemp -d)"
          hdiutil attach "dist/Music Library.dmg" -nobrowse -readonly -mountpoint "$MNT"
          mkdir -p "$HOME/Applications"
          ditto "$MNT/Music Library.app" "$HOME/Applications/Music Library.app"
          hdiutil detach "$MNT"
          lipo -archs "$HOME/Applications/Music Library.app/Contents/MacOS/MusicLibrary"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Music Library.app"
      - name: App im Vorschaumodus starten
        run: scripts/run_snapshots.sh "$HOME/Applications/Music Library.app" "snapshots/${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.os }}
          path: snapshots/
          if-no-files-found: warn

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Music-Library-dmg
          path: dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/Music Library.dmg" "dist/Music Library.dmg.sha256" \
            --repo "${GITHUB_REPOSITORY}" --title "Music Library ${GITHUB_REF_NAME}" \
            --notes "Universal (Apple Silicon + Intel), macOS 13 Ventura oder neuer. Ad-hoc signiert – siehe INSTALLATION.md für den ersten Start."
