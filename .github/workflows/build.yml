# Music Library für macOS – Tests, Universal-Build, Vorschaubilder, DMG
#
# Ablauf (sparsam mit macOS-Minuten):
#   1. build    macOS 26 (Apple Silicon, Xcode 26): alle Swift-Tests → Universal Binary (arm64 + x86_64)
#               → App-Bundle (ad-hoc signiert) → Vorschaubilder mit und ohne Liquid Glass → DMG
#   2. smoke    Die fertige DMG wird auf Apple Silicon (macOS 14) eingehängt, die App installiert und im
#               Vorschaumodus gestartet – nativ (arm64) und als Intel-Code über Rosetta (x86_64)
#      intel    Echter Intel-Mac (macOS 15): alle Tests in x86_64
#   3. release  Nur bei Tags „v*“: GitHub-Release mit DMG und Prüfsumme
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_runner:
        description: "Rechner für den Build-Job (Ausweichmöglichkeit, falls macos-26 nicht verfügbar ist)"
        default: macos-26

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, Universal-Build, DMG (macOS 26)
    runs-on: ${{ inputs.build_runner || 'macos-26' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          # Neuestes Xcode 26 wählen, falls vorhanden (Liquid Glass braucht das macOS-26-SDK)
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ "${MAJOR:-0}" -lt 26 ] && [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Developer-ID-Zertifikat laden (nur wenn als Secret hinterlegt)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/notarize.sh keychain
      - name: App bauen (arm64 + x86_64; ad-hoc oder Developer ID)
        env:
          VERSION: "2.2.3"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          mkdir -p logs
          scripts/build_app.sh 2>&1 | tee logs/build-output.txt
      - name: Vorschaubilder (Liquid Glass)
        id: snap_glass
        # Nur auf Apple Silicon: die Intel-Maschinen von GitHub haben keine Metal-Grafik (Ausweich-Build)
        if: runner.arch == 'ARM64'
        continue-on-error: true
        run: scripts/run_snapshots.sh "build/Music Library.app" snapshots/macos26-liquid-glass
      - name: Vorschaubilder (Rückfall ohne Liquid Glass)
        id: snap_fallback
        if: runner.arch == 'ARM64'
        continue-on-error: true
        env:
          ML_FORCE_GLASS_FALLBACK: "1"
        run: scripts/run_snapshots.sh "build/Music Library.app" snapshots/macos26-fallback
      - name: Messlauf mit 10.000 Titeln
        id: bench
        if: runner.arch == 'ARM64'
        continue-on-error: true
        run: scripts/run_benchmark.sh "build/Music Library.app" benchmark/macos26 10000
      - name: DMG erstellen
        run: |
          set -o pipefail
          scripts/make_dmg.sh 2>&1 | tee logs/dmg-output.txt
      - name: DMG beglaubigen (nur mit Developer-ID-Zugangsdaten)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -o pipefail
          scripts/notarize.sh dmg 2>&1 | tee logs/notarize-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Library-dmg
          path: |
            dist/Music Library.dmg
            dist/Music Library.dmg.sha256
          if-no-files-found: error
      - name: ffmpeg für den Audio-Unversehrtheitstest
        if: always()
        continue-on-error: true
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg >/dev/null 2>&1 || true
      - name: Swift-Tests
        if: always()
        run: |
          set -o pipefail
          mkdir -p logs
          swift test 2>&1 | tee logs/test-output.txt
      - name: Vorschaubilder ohne Fehler?
        if: steps.snap_glass.outcome == 'failure' || steps.snap_fallback.outcome == 'failure'
        run: |
          echo "Vorschaumodus fehlgeschlagen (Liquid Glass: ${{ steps.snap_glass.outcome }}, Rückfall: ${{ steps.snap_fallback.outcome }})"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-macos26
          path: snapshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-macos26
          path: benchmark/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos26
          path: logs/
          if-no-files-found: ignore

  # Die fertige DMG installieren und die App starten (Vorschaumodus zeichnet alle Ansichten):
  # Apple Silicon nativ und der Intel-Teil des Universal Binary über Rosetta.
  smoke:
    name: Starttest (${{ matrix.label }})
    needs: build
    # auch wenn nur Tests fehlschlagen: die DMG ist dann schon hochgeladen
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 bietet GitHub seit November 2026 nicht mehr an („configuration … is not supported“)
          - os: macos-15
            label: Apple Silicon · macOS 15
            arch: ""
            name: macos-15
          - os: macos-15
            label: Intel-Code über Rosetta · macOS 15
            arch: x86_64
            name: macos-15-rosetta-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Music-Library-dmg
          path: dist
      - name: Rosetta bereitstellen
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: DMG einhängen und App installieren
        run: |
          sw_vers
          uname -m
          (cd dist && shasum -a 256 -c "Music Library.dmg.sha256")
          MNT="$(mktemp -d)"
          hdiutil attach "dist/Music Library.dmg" -nobrowse -readonly -mountpoint "$MNT"
          mkdir -p "$HOME/Applications"
          ditto "$MNT/Music Library.app" "$HOME/Applications/Music Library.app"
          hdiutil detach "$MNT"
          lipo -archs "$HOME/Applications/Music Library.app/Contents/MacOS/MusicLibrary"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Music Library.app"
      - name: App im Vorschaumodus starten
        env:
          SNAPSHOT_ARCH: ${{ matrix.arch }}
          # arm64: alle Ansichten; Intel-Code über Rosetta: eine Auswahl typischer Ansichten
          ML_SNAPSHOT_ONLY: ${{ matrix.arch == 'x86_64' && '01-bibliothek,03-alben,03-album-detail,10-vinyl,12-kassette,13-equalizer,14-metadaten,17-einstellungen,21-alben-coverflow,21-alben-detailliste,30-modern-glass,31-aurora,32-studio-reel,34-mini-gross,35-popover-tonhoehe,40-einstellungen-equalizer,50-mini-riesig,52-player-formatzeile,26-titel-raster-gescrollt,27-auswahl-alben,53-equalizer-fenster-pop' || '' }}
        run: |
          mkdir -p "snapshots/${{ matrix.name }}"
          scripts/run_snapshots.sh "$HOME/Applications/Music Library.app" "snapshots/${{ matrix.name }}"
      - name: Messlauf mit 10.000 Titeln
        if: always()
        continue-on-error: true
        env:
          SNAPSHOT_ARCH: ${{ matrix.arch }}
        run: scripts/run_benchmark.sh "$HOME/Applications/Music Library.app" "benchmark/${{ matrix.name }}" 10000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.name }}
          path: |
            snapshots/
            benchmark/
          if-no-files-found: ignore

  # Echter Intel-Mac (macOS 15): alle Tests nativ in x86_64. Der Vorschaumodus wird nur versucht –
  # die virtuellen Intel-Maschinen von GitHub haben keine Metal-Grafik, SwiftUI kann dort abbrechen.
  intel:
    name: Intel · macOS 15 (Tests)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: ffmpeg für den Audio-Unversehrtheitstest
        continue-on-error: true
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg >/dev/null 2>&1 || true
      - name: Swift-Tests (x86_64)
        run: |
          set -o pipefail
          mkdir -p logs
          swift test 2>&1 | tee logs/test-output-intel.txt
      - name: Vorschaumodus versuchen (ohne Metal-Grafik, nur zur Information)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p snapshots/macos-15-intel
          scripts/run_snapshots.sh .build/debug/MusicLibrary snapshots/macos-15-intel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-macos-15
          path: |
            logs/
            snapshots/
          if-no-files-found: ignore

  # Alle Ergebnisse (DMG, Vorschaubilder, Protokolle) zusätzlich in den Zweig „ci-ergebnisse“ legen –
  # so lassen sie sich auch ohne Actions-Schnittstelle mit git abholen.
  results:
    name: Ergebnisse sichern
    if: always()
    needs: [build, smoke, intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ergebnisse
      - name: Vorschaubilder verkleinern (PNG → JPEG)
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow
          python3 - <<'PY'
          import pathlib
          from PIL import Image
          for p in pathlib.Path("ergebnisse").rglob("*.png"):
              Image.open(p).convert("RGB").save(p.with_suffix(".jpg"), quality=86, optimize=True)
              p.unlink()
          PY
      - name: In Zweig „ci-ergebnisse“ schreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ergebnisse
          {
            echo "Lauf: ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
            echo "build: ${{ needs.build.result }}"
            echo "smoke: ${{ needs.smoke.result }}"
            echo "intel: ${{ needs.intel.result }}"
            date -u
          } > ERGEBNIS.txt
          git init -q -b ci-ergebnisse
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI-Ergebnisse Lauf ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-ergebnisse

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke, intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Music-Library-dmg
          path: dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/Music Library.dmg" "dist/Music Library.dmg.sha256" \
            --repo "${GITHUB_REPOSITORY}" --title "Music Library ${GITHUB_REF_NAME}" \
            --notes "Universal (Apple Silicon + Intel), macOS 13 Ventura oder neuer. Ad-hoc signiert – siehe docs/INSTALLATION.md für den ersten Start."
