# KI-Musik Ende-zu-Ende: richtet die KI-Umgebung mit dem Code der App ein (KIInstaller: uv, ACE-Step, Python-Pakete,
# Modelle), erzeugt Musik über KIEngine in der Sandbox ohne Netz, prüft Abbruch und Fehler (KIEngineE2ETests), danach
# Gesangstrennung und Spracherkennung als Ersatz für einen Hörtest. Nur von Hand. Ergebnisse im Zweig „ci-ki-e2e-<Rechner>“.
name: KI-E2E

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Apple-Silicon-Rechner (macos-15, macos-26)"
        default: "macos-15"
      dit_device:
        description: "Gerät für das Musikmodell (auto oder cpu – virtuelle Rechner haben wenig GPU-Speicher)"
        default: "auto"
      mlx_dit:
        description: "Musikmodell mit MLX (1) oder PyTorch (0)"
        default: "1"
      lm_backend:
        description: "Sprachmodell mit mlx oder pt"
        default: "mlx"

concurrency:
  group: ki-e2e-${{ inputs.runner }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  e2e:
    name: KI-E2E (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          mkdir -p out/audio
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; echo "RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"; xcodebuild -version | head -1; } | tee out/rechner.txt
          command -v ffmpeg >/dev/null || brew install --quiet ffmpeg > out/brew.log 2>&1 || true
      - name: Bauen (Tests)
        run: |
          swift build --build-tests > out/build-tests.log 2>&1 || { grep -n "error:" out/build-tests.log | head -80; exit 1; }
      - name: KI-Ende-zu-Ende
        continue-on-error: true
        env:
          KI_E2E: "1"
          KI_E2E_BASE: ${{ runner.temp }}/ki
          KI_E2E_OUT: ${{ github.workspace }}/out/audio
          KI_DIT_DEVICE: ${{ inputs.dit_device }}
          KI_MLX_DIT: ${{ inputs.mlx_dit }}
          KI_LM_BACKEND: ${{ inputs.lm_backend }}
        run: |
          set +e
          swift test --skip-build --filter KIEngineE2ETests > out/e2e.log 2>&1
          STATUS=$?
          grep -E "\[KI-E2E\]|error:|passed|failed|skipped|Executed" out/e2e.log | head -120
          cp "$RUNNER_TEMP/ki/ki-musik.log" out/ki-musik.log 2>/dev/null || true
          cp "$RUNNER_TEMP/ki/installation.json" out/installation.json 2>/dev/null || true
          du -sh "$RUNNER_TEMP/ki"/* 2>/dev/null | tee out/groessen.txt
          exit $STATUS
      - name: Trennen und Spracherkennung
        continue-on-error: true
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          uv venv -q --python 3.12 "$RUNNER_TEMP/listen"
          uv pip install -q --python "$RUNNER_TEMP/listen/bin/python" demucs-mlx mlx-whisper > out/listen-install.log 2>&1 || tail -20 out/listen-install.log
          export PATH="$RUNNER_TEMP/listen/bin:$PATH"
          python scripts/ki/probe_listen.py out > out/listen.log 2>&1
          grep -E "\[Hören\]|\[Trennen\]" out/listen.log | head -40
      - name: Ergebnisse in Zweig sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="ci-ki-e2e-${{ inputs.runner }}"
          cd out
          find . \( -name "*.flac" -o -name "*.wav" \) | while read -r f; do
            ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 192k "${f%.*}.mp3" && rm "$f"; done || true
          find . -name "*.mp3" -size +20M -delete || true
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "KI-E2E $GITHUB_SHA ${{ inputs.runner }}" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
