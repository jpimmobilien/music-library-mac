# Abnahme einer fertigen DMG aus einem Build-Lauf (Eingabe: Lauf-Nummer):
#  1. Starttest: DMG prüfen, installieren, alle Ansichten im Vorschaumodus (Apple Silicon nativ und Intel-Code über Rosetta)
#  2. Vergleichsmessung 2.0 ↔ 2.1 auf demselben Rechner (je zwei Durchgänge, abwechselnd)
# Ergebnisse in Zweigen „ci-abnahme-*“. (macOS 14 wird von GitHub nicht mehr angeboten.)
name: Abnahme

on:
  push:
    branches: [release-check]
  workflow_dispatch:
    inputs:
      run_id:
        description: Lauf-Nummer des Build-Workflows mit der DMG
        required: true

permissions:
  contents: write
  actions: read

env:
  RUN_ID: ${{ inputs.run_id || '42223937971' }}

jobs:
  smoke:
    name: Starttest (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: Apple Silicon · macOS 15
            arch: ""
            name: macos-15
          - os: macos-15
            label: Intel-Code über Rosetta · macOS 15
            arch: x86_64
            name: macos-15-rosetta-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Music-Library-dmg
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Rosetta bereitstellen
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: DMG einhängen und App installieren
        run: |
          sw_vers
          uname -m
          (cd dist && shasum -a 256 -c "Music Library.dmg.sha256")
          MNT="$(mktemp -d)"
          hdiutil attach "dist/Music Library.dmg" -nobrowse -readonly -mountpoint "$MNT"
          mkdir -p "$HOME/Applications"
          ditto "$MNT/Music Library.app" "$HOME/Applications/Music Library.app"
          hdiutil detach "$MNT"
          lipo -archs "$HOME/Applications/Music Library.app/Contents/MacOS/MusicLibrary"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Music Library.app"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$HOME/Applications/Music Library.app/Contents/Info.plist"
      - name: App im Vorschaumodus starten
        continue-on-error: true
        env:
          SNAPSHOT_ARCH: ${{ matrix.arch }}
          ML_SNAPSHOT_ONLY: ${{ matrix.arch == 'x86_64' && '01-bibliothek,03-alben,03-album-detail,10-vinyl,12-kassette,13-equalizer,14-metadaten,17-einstellungen,21-alben-coverflow,21-alben-kompakt,21-alben-detailliste,30-modern-glass,31-aurora,32-studio-reel,34-mini-gross,35-popover-tonhoehe,40-einstellungen-equalizer,50-mini-riesig,50-mini-sehr-gross,51-hintergrund-blau,52-player-formatzeile,52-player-balken-cd,26-titel-raster-gescrollt,27-auswahl-alben,28-loeschen-album,53-equalizer-fenster-pop' || '' }}
        run: |
          mkdir -p "snapshots/${{ matrix.name }}"
          scripts/run_snapshots.sh "$HOME/Applications/Music Library.app" "snapshots/${{ matrix.name }}"
      - name: Messlauf mit 10.000 Titeln
        if: always()
        continue-on-error: true
        env:
          SNAPSHOT_ARCH: ${{ matrix.arch }}
        run: scripts/run_benchmark.sh "$HOME/Applications/Music Library.app" "benchmark/${{ matrix.name }}" 10000
      - name: Ergebnisse in Zweig „ci-abnahme-${{ matrix.name }}“
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && cp -R snapshots benchmark out/ 2>/dev/null || true
          cd out
          # Bilder verkleinern (JPEG) wie im Build-Workflow
          find . -name "*.png" | while read -r f; do sips -s format jpeg -s formatOptions 82 "$f" --out "${f%.png}.jpg" >/dev/null 2>&1 && rm "$f"; done
          git init -q -b "ci-abnahme-${{ matrix.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Abnahme ${{ matrix.name }}" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-abnahme-${{ matrix.name }}"

  ab:
    name: Vergleich 2.0 ↔ 2.1 (macOS 15, Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: release-2.0
          path: v20
      - uses: actions/download-artifact@v4
        with:
          name: Music-Library-dmg
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Version 2.1 aus der DMG, Version 2.0 bauen
        run: |
          MNT="$(mktemp -d)"
          hdiutil attach "dist/Music Library.dmg" -nobrowse -readonly -mountpoint "$MNT"
          ditto "$MNT/Music Library.app" "v21.app"
          hdiutil detach "$MNT"
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          (cd v20 && scripts/build_app.sh > ../build20.log 2>&1) || (tail -30 build20.log; exit 1)
          ditto "v20/build/Music Library.app" "v20.app"
      - name: Messläufe (abwechselnd)
        continue-on-error: true
        run: |
          mkdir -p ab
          for round in 1 2; do
            for v in v20 v21; do
              ML_BENCH_QUICK=1 BENCHMARK_TIMEOUT=900 scripts/run_benchmark.sh "$v.app" "ab/$v-$round" 10000 > "ab/$v-$round.out" 2>&1 || true
              echo "== $v Runde $round"; grep -E "Scrollschritt|Bereich wechseln|Suche tippen|Leerlauf.*%|Großer" "ab/$v-$round/benchmark.txt" || tail -5 "ab/$v-$round.out"
            done
          done
      - name: Ergebnisse in Zweig „ci-abnahme-ab“
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && cp -R ab out/ 2>/dev/null || true
          cd out
          git init -q -b "ci-abnahme-ab"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vergleich 2.0/2.1" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-abnahme-ab"
