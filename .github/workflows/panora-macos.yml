# Panora – lokale KI für den Mac: Tests, Build (xcodebuild, MLX mit Metal), Selbsttest, Bildschirmfotos,
# Ende-zu-Ende-Test mit echtem MLX-Modell, DMG. Ergebnisse landen im Zweig „ci-ergebnisse-panora-macos“.
#
#   core     Linux: Kernlogik (PanoraCore) testen, Katalog auf Hugging Face prüfen
#   build    macOS 26 (Apple Silicon): Xcode-Projekt erzeugen → kompilieren → App prüfen → Selbsttest →
#            Bildschirmfotos → E2E (Qwen3 0.6B lokal) → Panora.dmg → aus der DMG installieren und starten
#   results  DMG, Protokolle und Bilder → Zweig „ci-ergebnisse-panora-macos“
name: Panora macOS

on:
  push:
    branches: [panora-macos]
  workflow_dispatch:

concurrency:
  group: panora-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERSION: "0.1.0"

jobs:
  core:
    name: Kernlogik · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tests (PanoraCore)
        run: |
          set -o pipefail
          mkdir -p logs
          swift --version | tee logs/swift-linux.txt
          swift test 2>&1 | tee logs/test-output-linux.txt
      - name: Katalog auf Hugging Face prüfen
        if: always()
        run: python3 tools/check_catalog.py 2>&1 | tee logs/catalog-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-core
          path: logs/
          if-no-files-found: ignore

  build:
    name: Build, Tests und DMG (macOS 26)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          mkdir -p logs
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi -E "beta|rc" | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          { sw_vers; uname -m; xcodebuild -version; swift --version; xcrun --show-sdk-version; } 2>&1 | tee logs/system.txt
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version | tee -a logs/system.txt
          # Metal-Werkzeuge (ab Xcode 26 eine eigene Komponente) für die MLX-Shader
          xcrun -sdk macosx metal --version 2>&1 | tee -a logs/system.txt || xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -5 | tee -a logs/system.txt
          xcrun -sdk macosx metal --version 2>&1 | tee -a logs/system.txt || true
      - name: Kernlogik (macOS)
        run: |
          set -o pipefail
          swift test 2>&1 | tee logs/test-output-macos.txt
      - name: Panora.app bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          scripts/build_app.sh 2>&1 | tee logs/build-output.txt
      - name: Selbsttest
        if: ${{ !cancelled() && hashFiles('build/Panora.app/Contents/MacOS/Panora') != '' }}
        run: |
          RUN_LOG=logs/selftest.log scripts/run_app_mode.sh build/Panora.app 180 --selftest "$PWD/logs/selftest.json" || true
          cat logs/selftest.json
          python3 -c "import json,sys; d=json.load(open('logs/selftest.json')); bad=[c['name'] for c in d['checks'] if not c['ok']]; print('Fehlgeschlagen:', bad); sys.exit(0 if d['ok'] else 1)"
      - name: Bildschirmfotos
        if: ${{ !cancelled() && hashFiles('build/Panora.app/Contents/MacOS/Panora') != '' }}
        continue-on-error: true
        run: |
          mkdir -p snapshots/liquid-glass
          RUN_LOG=logs/snapshots.log scripts/run_app_mode.sh build/Panora.app 600 --snapshot "$PWD/snapshots/liquid-glass"
      - name: Bildschirmfotos (ohne Liquid Glass)
        if: ${{ !cancelled() && hashFiles('build/Panora.app/Contents/MacOS/Panora') != '' }}
        continue-on-error: true
        env:
          PANORA_FORCE_GLASS_FALLBACK: "1"
        run: |
          mkdir -p snapshots/fallback
          RUN_LOG=logs/snapshots-fallback.log scripts/run_app_mode.sh build/Panora.app 600 --snapshot "$PWD/snapshots/fallback"
      - name: Ende-zu-Ende mit echtem MLX-Modell (Qwen3 0.6B)
        if: ${{ !cancelled() && hashFiles('build/Panora.app/Contents/MacOS/Panora') != '' }}
        continue-on-error: true
        run: |
          python3 tools/fetch_model.py mlx-community/Qwen3-0.6B-4bit "$RUNNER_TEMP/e2e-models" 2>&1 | tail -3
          RUN_LOG=logs/e2e.log scripts/run_app_mode.sh build/Panora.app 600 --e2e "$RUNNER_TEMP/e2e-models/mlx-community__Qwen3-0.6B-4bit" "$PWD/logs/e2e.json" || true
          cat logs/e2e.json || true
          python3 -c "import json,sys; d=json.load(open('logs/e2e.json')); sys.exit(0 if d.get('ok') else 1)"
      - name: DMG erstellen und prüfen
        if: ${{ !cancelled() && hashFiles('build/Panora.app/Contents/MacOS/Panora') != '' }}
        run: |
          set -o pipefail
          scripts/make_dmg.sh 2>&1 | tee logs/dmg-output.txt
      - name: Aus der DMG installieren und starten
        if: ${{ !cancelled() && hashFiles('dist/Panora.dmg') != '' }}
        run: |
          set -e
          MNT="$(mktemp -d)"
          hdiutil attach dist/Panora.dmg -nobrowse -readonly -mountpoint "$MNT"
          mkdir -p "$HOME/Applications"
          rm -rf "$HOME/Applications/Panora.app"
          ditto "$MNT/Panora.app" "$HOME/Applications/Panora.app"
          hdiutil detach "$MNT"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Panora.app"
          RUN_LOG=logs/selftest-installiert.log scripts/run_app_mode.sh "$HOME/Applications/Panora.app" 180 --selftest "$PWD/logs/selftest-installiert.json" || true
          python3 -c "import json,sys; d=json.load(open('logs/selftest-installiert.json')); sys.exit(0 if d['ok'] else 1)"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('dist/Panora.dmg') != '' }}
        with:
          name: Panora-dmg
          path: |
            dist/Panora.dmg
            dist/Panora.dmg.sha256
      - name: Xcode-Projekt sichern
        if: always()
        run: zip -qr logs/Panora-xcodeproj.zip Panora.xcodeproj Xcode 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-build
          path: |
            logs/
            snapshots/
          if-no-files-found: ignore

  results:
    name: Ergebnisse sichern
    if: always()
    needs: [core, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ergebnisse
      - name: Bilder verkleinern (PNG → JPEG)
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow
          python3 - <<'PY'
          import pathlib
          from PIL import Image
          for p in pathlib.Path("ergebnisse").rglob("*.png"):
              Image.open(p).convert("RGB").save(p.with_suffix(".jpg"), quality=86, optimize=True)
              p.unlink()
          PY
      - name: In Zweig „ci-ergebnisse-panora-macos“ schreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ergebnisse
          {
            echo "Lauf: ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
            echo "core: ${{ needs.core.result }}"
            echo "build: ${{ needs.build.result }}"
            ls Panora-dmg 2>/dev/null | sed 's/^/dmg: /'
            date -u
          } > ERGEBNIS.txt
          git init -q -b ci-ergebnisse-panora-macos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI-Ergebnisse Panora Lauf ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-ergebnisse-panora-macos
