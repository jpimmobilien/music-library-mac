# ORBIT Android – Unit-Tests, Release-Build (APK), Prüfung des Pakets, Installation und Bildschirmfotos auf einem
# echten Android-Emulator. Ergebnisse (APK, Protokolle, Testberichte, Bildschirmfotos) landen im Zweig
# ci-ergebnisse-orbit-android, weil Artefakt-Downloads aus der Arbeitsumgebung nicht erreichbar sind.
#
#   build    Ubuntu + Android-SDK: ./gradlew test, assembleRelease, apksigner/aapt2-Prüfung
#   screens  Emulator (API 35, x86_64): Installation, Start, Bildschirmfotos (Telefon + Tablet, hell + dunkel)
#   results  Ergebnisse einsammeln und in den Ergebniszweig schreiben
name: ORBIT Android

on:
  push:
    branches: [orbit-android]
  workflow_dispatch:

concurrency:
  group: orbit-android
  cancel-in-progress: true

permissions:
  contents: write

env:
  VERSION: "0.4.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Umgebung
        run: |
          mkdir -p logs
          { java -version 2>&1; echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"; } | tee logs/umgebung.txt
      - name: Unit-Tests (alle Module)
        run: ./gradlew --no-daemon --stacktrace test 2>&1 | tee logs/tests.txt; exit ${PIPESTATUS[0]}
      - name: Testberichte sammeln
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          for d in $(find . -path '*/build/reports/tests' -type d); do
            m=$(echo "$d" | sed 's#^\./##; s#/build/reports/tests##; s#/#_#g'); cp -r "$d" "reports/$m"; done
          python3 ci/summarize_tests.py . > logs/test-zusammenfassung.txt || true
          cat logs/test-zusammenfassung.txt || true
      - name: Release-Build (APK)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee logs/build.txt; exit ${PIPESTATUS[0]}
      - name: APK prüfen
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp "$APK" "dist/ORBIT-$VERSION.apk"
          "$BT/apksigner" verify --verbose --print-certs "dist/ORBIT-$VERSION.apk" | tee logs/apk-signatur.txt
          "$BT/aapt2" dump badging "dist/ORBIT-$VERSION.apk" | tee logs/apk-badging.txt
          grep -q "application-label:'ORBIT'" logs/apk-badging.txt
          (cd dist && sha256sum "ORBIT-$VERSION.apk" > "ORBIT-$VERSION.apk.sha256")
          ls -la dist | tee -a logs/apk-badging.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: orbit-build
          path: |
            dist
            logs
            reports

  screens:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orbit-build
          path: build-out
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator – Installation, Start, Bildschirmfotos
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/android_screens.sh build-out/dist/ORBIT-${{ env.VERSION }}.apk screens
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: orbit-screens
          path: screens

  results:
    needs: [build, screens]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Ergebniszweig schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "orbit-ci"
          git config --global user.email "orbit-ci@users.noreply.github.com"
          git clone --depth 1 --branch ci-ergebnisse-orbit-android "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" res 2>/dev/null || {
            mkdir res && cd res && git init -q && git checkout -q --orphan ci-ergebnisse-orbit-android && cd ..; }
          cd res
          git rm -rq --ignore-unmatch . >/dev/null 2>&1 || true
          rm -rf ./*
          cp -r ../out/* . 2>/dev/null || true
          {
            echo "# ORBIT Android – Ergebnisse"
            echo
            echo "Lauf: ${GITHUB_RUN_NUMBER} · Commit: ${GITHUB_SHA}"
            echo "build: ${{ needs.build.result }} · screens: ${{ needs.screens.result }}"
          } > README.md
          git add -A
          git commit -qm "Ergebnisse Lauf ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" || true
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-ergebnisse-orbit-android --force
