# Zentrale Versionsverwaltung ("Version Catalog") von AETHER.
#
# Werkzeugkette bewusst identisch mit deinen Projekten Filmbibliothek 7.4.2, Musikbibliothek 1.3.0 und
# DriveGlass 1.1.0, damit Android Studio auf deinem Mac nichts Neues an Gradle, AGP, Kotlin oder Compose
# laden muss:
#  - AGP 9.3.1 (benötigt Gradle >= 9.5.0, Wrapper: 9.6.1, JDK 17 – bringt Android Studio mit)
#  - Kotlin 2.4.21 (laut JetBrains mit AGP bis 9.3.1 und Gradle bis 9.7.0 kompatibel)
#  - Compose-BOM 2026.09.00, Activity 1.13.0, Lifecycle 2.11.0
#  - DataStore 1.3.0, Core 1.19.1, kotlinx-coroutines 1.11.0 (wie DriveGlass)
#
# Bewusst NICHT enthalten (Begründung: docs/ENTSCHEIDUNGEN.md):
#  - keine Navigation-Bibliothek (eigene, kleine Navigation mit getrennten Verläufen je Bereich)
#  - kein Room (Phase 1 speichert nur Einstellungen – dafür reicht DataStore)
#  - keine Analyse-, Werbe- oder Cloud-Bibliotheken, keine Internet-Berechtigung

[versions]
agp = "9.3.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.3.0"
coreKtx = "1.19.1"
coroutines = "1.11.0"
junit = "4.13.2"

[libraries]
# Kotlin-Gradle-Plugin: legt die Kotlin-Version für das in AGP 9 eingebaute Kotlin fest und stellt
# zusätzlich das Plugin "org.jetbrains.kotlin.jvm" für das reine Kotlin-Modul core/model bereit.
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
